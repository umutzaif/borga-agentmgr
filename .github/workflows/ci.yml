name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Install the wheel in a clean venv and smoke-test
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          cd "$(mktemp -d)"
          /tmp/v/bin/agentmgr --version
          /tmp/v/bin/agentmgr init --name ci
          /tmp/v/bin/agentmgr verify
